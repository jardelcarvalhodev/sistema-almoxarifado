<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Fornecedor - Kaiko</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="pagina-cadastro">

        <header class="menu">

            <a href="/" class="logo-menu">
                <img src="{{ url_for('static', filename='logo_kaiko.png') }}" alt="Kaiko">
            </a>

            <nav>

                <a href="/cadastrar">📦 Cadastrar Produto</a>

                <a href="/fornecedor">🏢 Cadastrar Fornecedor</a>

                <a href="/entrada">📄 Entrada de Material</a>

                <a href="/saida">📄 Saída de Material</a>

                <a href="/estoque">🔍 Consultar Estoque</a>

            </nav>

        </header>


        <main class="cadastro-container">

            <div class="cadastro-card">

                <div class="cadastro-titulo">

                    <span>🏢</span>

                    <h1>Cadastrar Fornecedor</h1>

                </div>


                <form method="POST" action="/fornecedor">


                    <div class="linha-form">

                        <div class="campo">

                            <label for="nome">
                                Nome do Fornecedor <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite o nome do fornecedor"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="cnpj">
                                CNPJ
                            </label>

                            <input
                                type="text"
                                id="cnpj"
                                name="cnpj"
                                placeholder="Digite o CNPJ"
                                required
                            >

                        </div>

                    </div>


                    <div class="linha-form">

                        <div class="campo">

                            <label for="telefone">
                                Telefone
                            </label>

                            <input
                                type="text"
                                id="telefone"
                                name="telefone"
                                placeholder="Digite o telefone"
                            >

                        </div>


                        <div class="campo">

                            <label for="email">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite o e-mail"
                            >

                        </div>

                    </div>


                    <div class="acoes">

                        <button
                            type="submit"
                            class="btn-salvar"
                        >
                            💾 Salvar Fornecedor
                        </button>

                        <button
                            type="reset"
                            class="btn-limpar"
                        >
                            🔄 Limpar Campos
                        </button>

                    </div>


                </form>

            </div>

        </main>

    </div>

</body>

</html>
