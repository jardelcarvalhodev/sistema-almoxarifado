
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JC Sistema</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 38px 32px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            display: block;
            width: 115px;
            height: 115px;
            object-fit: contain;
            margin: 0 auto 16px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 27px;
            color: #ff8c00;
        }

        .subtitulo {
            margin: 10px 0 28px;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 13px 14px;
            background: #292929;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .campo input:focus {
            border-color: #ff8c00;
        }

        .botao-login {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: #ff8c00;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao-login:hover {
            background: #ffa52b;
        }

        .mensagem {
            padding: 11px;
            margin-bottom: 16px;
            background: #38251a;
            color: #ffbd80;
            border: 1px solid #75451f;
            border-radius: 7px;
            font-size: 14px;
        }

        .cadastro {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #bbb;
        }

        .cadastro a {
            color: #ff8c00;
            font-weight: bold;
            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        .ajuda {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <img
            src="{{ url_for('static', filename='logo-jc.png') }}"
            alt="Logo JC Sistema"
            class="logo"
        >

        <h1>JC Sistema</h1>
        <p class="subtitulo">Sistema de Controle de Almoxarifado</p>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="mensagem">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="campo">
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="botao-login">
                Entrar no sistema
            </button>
        </form>

        <div class="cadastro">
            Ainda não tem uma conta?
            <a href="{{ url_for('cadastro_usuario') }}">Cadastre-se</a>
        </div>

        <div class="ajuda">
            JC Sistema · Controle de Almoxarifado
        </div>
    </main>
</body>
</html>
