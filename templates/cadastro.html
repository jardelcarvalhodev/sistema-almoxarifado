<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Produto - Kaiko</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="pagina-cadastro">

        <!-- MENU SUPERIOR -->

        <header class="menu">

            <a href="/" class="logo-menu">
                <img src="{{ url_for('static', filename='logo_kaiko.png') }}" alt="Kaiko">
            </a>

            <nav>

                <a href="/cadastrar">📦 Cadastrar Produto</a>

                <a href="/fornecedor">🏢 Cadastrar Fornecedor</a>

                <a href="/entrada">📄 Entrada de Material</a>

                <a href="/saida">📄 Saída de Material</a>

                <a href="/estoque">🔍 Consultar Estoque</a>

            </nav>

        </header>


        <!-- ÁREA DO CADASTRO -->

        <main class="cadastro-container">

            <div class="cadastro-card">

                <div class="cadastro-titulo">

                    <span>📦</span>

                    <h1>Cadastrar Produto</h1>

                </div>


                <form method="POST" action="/cadastrar">


                    <div class="linha-form">


                        <div class="campo">

                            <label for="codigo">
                                Código do Produto <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="codigo"
                                name="codigo"
                                placeholder="Digite o código do produto"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="nome">
                                Nome do Produto <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite o nome do produto"
                                required
                            >

                        </div>


                    </div>


                    <div class="linha-form">


                        <div class="campo">

                            <label for="categoria">
                                Categoria <span>*</span>
                            </label>

                            <select id="categoria" name="categoria" required>

                                <option value="">
                                    Selecione a categoria
                                </option>

                                <option value="Higiene">
                                    Higiene
                                </option>

                                <option value="Limpeza">
                                    Limpeza
                                </option>

                                <option value="Escritório">
                                    Escritório
                                </option>

                                <option value="Descartáveis">
                                    Descartáveis
                                </option>

                                <option value="Outros">
                                    Outros
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label for="unidade">
                                Unidade de Medida <span>*</span>
                            </label>

                            <select id="unidade" name="unidade" required>

                                <option value="">
                                    Selecione a unidade
                                </option>

                                <option value="UN">
                                    UN - Unidade
                                </option>

                                <option value="CX">
                                    CX - Caixa
                                </option>

                                <option value="PCT">
                                    PCT - Pacote
                                </option>

                                <option value="FD">
                                    FD - Fardo
                                </option>

                                <option value="LT">
                                    LT - Litro
                                </option>

                                <option value="KG">
                                    KG - Quilograma
                                </option>

                            </select>

                        </div>


                    </div>


                    <div class="linha-form">


                        <div class="campo pequeno">

                            <label for="estoque_minimo">
                                Estoque Mínimo
                            </label>

                            <input
                                type="number"
                                id="estoque_minimo"
                                name="estoque_minimo"
                                placeholder="Ex: 5"
                                min="0"
                            >

                        </div>


                        <div class="campo pequeno">

                            <label for="quantidade">
                                Estoque Atual
                            </label>

                            <input
                                type="number"
                                id="quantidade"
                                name="quantidade"
                                placeholder="Ex: 0"
                                min="0"
                                value="0"
                            >

                        </div>

                        <div class="campo pequeno">

    <label for="lote">
        Lote <span>*</span>
    </label>

    <input
        type="text"
        id="lote"
        name="lote"
        placeholder="Digite o lote"
        required
    >

</div>

                        <div class="campo descricao">

                            <label for="descricao">
                                Descrição
                            </label>

                            <textarea
                                id="descricao"
                                name="descricao"
                                placeholder="Digite uma descrição (opcional)"
                            ></textarea>

                        </div>


                    </div>


                    <div class="acoes">

                        <button type="submit" class="btn-salvar">
                            💾 Salvar Produto
                        </button>

                        <button type="reset" class="btn-limpar">
                            🔄 Limpar Campos
                        </button>

                    </div>


                </form>

            </div>

        </main>

    </div>

</body>

</html>
